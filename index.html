<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_CRITICAL_OVERRIDE</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: monospace;
            padding: 15px;
            font-size: 14px;
            overflow: hidden;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .glitch {
            text-shadow: 2px 0 red, -2px 0 cyan;
        }
        .hacked-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #3b0000;
            color: #ff0000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 999;
        }
        .hacked-screen h1 {
            font-size: 50px;
            text-shadow: 4px 4px 15px #000;
            margin: 0;
            animation: flicker 0.8s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.02); }
        }
    </style>
</head>
<body>
    <div id="terminal"></div>

    <div class="hacked-screen" id="hackedScreen">
        <h1>⚠️ تم اختراق جهازك ⚠️</h1>
        <br>
        <h2 style="color: #fff; font-size: 35px;">من قبل Abd ul rahman</h2>
        <p style="color: #ff9999; font-size: 20px; margin-top: 15px;">سيطر النظام بالكامل على الكاميرا، الملفات، والشبكة الخاصة بك...</p>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const hackedScreen = document.getElementById('hackedScreen');
        
        // كلمات وسطور تملى الشاشة بالعرض والطول بشكل مرعب
        const words = ["OVERRIDE", "BYPASS", "KERNEL_PANIC", "ROOT_ACCESS", "0x9F4C", "ENCRYPTED", "SYS_BREACH", "MEMORY_DUMP", "FIREWALL_DOWN", "INJECTING_PAYLOAD", "10101101", "MALWARE_ACTIVE"];
        
        let floodTimer = setInterval(() => {
            let line = "";
            // تخلي السطر الواحد يملى عرض الشاشة بكلمات عشوائية وسريعة
            for(let j=0; j < 12; j++) {
                let randomWord = words[Math.floor(Math.random() * words.length)];
                let randomHex = Math.floor(Math.random()*999999);
                line += `[SYS_${randomHex}]_${randomWord}  `;
            }
            terminal.innerHTML += `<span class="glitch">${line}</span><br>`;
            window.scrollTo(0, document.body.scrollHeight);
        }, 30);

        // بعد 5 ثواني من الرعب والملء بالعرض، الشاشة تقفل وتجيب اسمك
        setTimeout(() => {
            clearInterval(floodTimer);
            hackedScreen.style.display = 'flex';
        }, 5000);
    </script>
</body>
</html>
