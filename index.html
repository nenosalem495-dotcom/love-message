<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_OVERRIDE // SECURE_CORE</title>
    <style>
        body {
            background-color: #000;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
            font-size: 18px;
            overflow: hidden;
        }
        .glitch {
            text-shadow: 2px 0 red, -2px 0 cyan;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <script>
        const terminal = document.getElementById('terminal');
        const lines = [
            "[*] Initializing Quantum Core...",
            "[!] WARNING: Bypassing mainframe firewall...",
            "[x] Access granted to root permissions.",
            "[+] Decrypting classified database...",
            "----------------------------------------",
            "STATUS: IMPOSSIBLE ALGORITHM BYPASSED.",
            "WELCOME, MASTER. SYSTEM FULLY COMPROMISED."
        ];
        
        let i = 0;
        function typeLine() {
            if (i < lines.length) {
                terminal.innerHTML += lines[i] + "<br>";
                i++;
                setTimeout(typeLine, 800);
            } else {
                setInterval(() => {
                    let randomStr = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    terminal.innerHTML += `<span class="glitch">[SYS_LOG] ${randomStr}</span><br>`;
                    window.scrollTo(0, document.body.scrollHeight);
                }, 50);
            }
        }
        setTimeout(typeLine, 500);
    </script>
</body>
</html>
