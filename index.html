<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Message ❤️</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 80px;
            margin: 0;
        }
        h2 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .heart-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-bottom: 20px;
        }
        .heart-container:hover {
            transform: scale(1.1);
        }
        .heart {
            background-color: #ff3366;
            display: inline-block;
            height: 120px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 120px;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
        }
        .heart:before,
        .heart:after {
            content: "";
            background-color: #ff3366;
            border-radius: 50%;
            height: 120px;
            position: absolute;
            width: 120px;
        }
        .heart:before {
            top: -60px;
            left: 0;
        }
        .heart:after {
            left: 60px;
            top: 0;
        }
        .text-inside {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            color: white;
            font-weight: bold;
            font-size: 15px;
            z-index: 10;
            width: 100px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        #message {
            margin-top: 30px;
            font-size: 32px;
            color: #e60026;
            font-weight: bold;
            display: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s ease-in-out;
            text-shadow: 0 2px 10px rgba(230, 0, 38, 0.3);
        }
        #message.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <h2>اضغط على القلب علشان تشوف رسالة الحب ❤️</h2>

    <div class="heart-container" onclick="showMessage()">
        <div class="heart"></div>
        <div class="text-inside">اضغطي هنا</div>
    </div>

    <div id="message">Love you ❤️</div>

    <script>
        function showMessage() {
            var msg = document.getElementById('message');
            msg.style.display = 'block';
            setTimeout(function() {
                msg.classList.add('show');
            }, 10);
        }
    </script>

</body>
</html>
