<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">car
    <title>UL BOB Animation</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* ملعب كرة قدم مبسط */
        .field {
            position: relative;
            width: 800px;
            height: 300px;
            background: linear-gradient(to bottom, #2e7d32, #1b5e20);
            border: 4px solid white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* المرمى */
        .goal {
            position: absolute;
            left: 0;
            top: 75px;
            width: 50px;
            height: 150px;
            border: 4px solid white;
            border-left: none;
            background: rgba(255, 255, 255, 0.1);
        }

        /* اللاعب */
        #player {
            position: absolute;
            bottom: 120px;
            left: 50px;
            font-size: 40px;
            transition: transform 1.5s ease-in-out;
            z-index: 2;
        }

        /* الكرة */
        #ball {
            position: absolute;
            bottom: 135px;
            left: 85px;
            font-size: 20px;
            transition: all 1s ease-in-out;
            z-index: 2;
        }

        /* زر التشغيل */
        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        button:hover {
            background-color: #f57c00;
        }

        /* ظهور الاسم UL BOB */
        #ul-bob {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 2px 2px 4px rgba(0,0,0,0.8);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="field">
        <div class="goal"></div>
        <div id="player">🏃‍♂️</div>
        <div id="ball">⚽</div>
        <div id="ul-bob">UL BOB</div>
    </div>

    <button onclick="playAnimation()">ابدأ الحركة</button>

    <script>
        function playAnimation() {
            const player = document.getElementById('player');
            const ball = document.getElementById('ball');
            const ulBob = document.getElementById('ul-bob');

            // إعادة تعيين العناصر لمكانها الأصلي لو تم الضغط مرة أخرى
            player.style.transform = 'translateX(0px)';
            ball.style.transform = 'translate(0px, 0px)';
            ulBob.style.opacity = '0';
            ulBob.style.transform = 'scale(0.5)';

            setTimeout(() => {
                // 1. يتحرك اللاعب ومعه الكرة نحو المنتصف (جري)
                player.style.transform = 'translateX(350px)';
                ball.style.transform = 'translateX(350px)';

                // 2. بعد أن يصل اللاعب، يشوت الكرة نحو الجون وتظهر كلمة UL BOB
                setTimeout(() => {
                    // حركة الشوط (تتحرك الكرة بسرعة لليسار داخل الجون، ويرتفع اللاعب قليلاً للاحتفال)
                    ball.style.transform = 'translate(-380px, -20px) rotate(360deg)';
                    player.style.transform = 'translateX(330px) translateY(-10px)';

                    // ظهور اسم UL BOB في منتصف الملعب
                    setTimeout(() => {
                        ulBob.style.opacity = '1';
                        ulBob.style.transform = 'scale(1)';
                    }, 500);

                }, 1500);

            }, 100);
        }
    </script>

</body>
</html>
