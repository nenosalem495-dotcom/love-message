<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dense Heart Love Effect</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0b0b;
            font-family: Arial, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .click-btn {
            padding: 14px 30px;
            font-size: 22px;
            background-color: #ff2a5f;
            color: white;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 95, 0.5);
            transition: 0.3s;
            z-index: 10;
            margin-bottom: 20px;
        }

        .click-btn:hover {
            background-color: #e01b4d;
            transform: scale(1.08);
        }

        .heart-container {
            position: relative;
            width: 450px;
            height: 450px;
        }

        .love-word {
            position: absolute;
            color: #ff3366;
            font-size: 11px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s ease-in-out;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(255, 51, 102, 0.6);
        }

        .love-word.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>

    <button class="click-btn" onclick="createDenseHeart()">اضغط هنا يا حب ❤️</button>
    <div class="heart-container" id="heartContainer"></div>

    <script>
        function createDenseHeart() {
            const container = document.getElementById('heartContainer');
            container.innerHTML = '';

            const points = [];
            
            for (let t = 0; t < Math.PI * 2; t += 0.05) {
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                points.push({ x: x * 13 + 225, y: y * 13 + 200 });
                points.push({ x: x * 10 + 225, y: y * 10 + 200 });
                points.push({ x: x * 7 + 225, y: y * 7 + 200 });
                points.push({ x: x * 4 + 225, y: y * 4 + 200 });
            }

            points.forEach((point, index) => {
                const word = document.createElement('div');
                word.className = 'love-word';
                word.innerText = 'Love You';
                
                word.style.left = point.x + 'px';
                word.style.top = point.y + 'px';
                
                container.appendChild(word);

                setTimeout(() => {
                    word.classList.add('show');
                }, index * 5);
            });
        }
    </script>

</body>
</html>
