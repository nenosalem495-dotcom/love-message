<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة جداً ❤️</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .box {
            max-width: 400px;
            margin: 0 auto;
            background: #161616;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        input {
            padding: 10px;
            width: 80%;
            background: #222;
            border: 1px solid #00ffcc;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #00b386;
        }
        #message {
            margin-top: 25px;
            font-size: 18px;
            white-space: pre-line;
            line-height: 1.6;
            color: #ff66b2;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>💖 مفاجأة ليكِ 💖</h2>
        <p>اكتبي اسمك هنا:</p>
        <input type="text" id="nameInput" placeholder="اكتبي الاسم هنا...">
        <br>
        <button onclick="startMagic()">اضغطي هنا</button>
        <div id="message"></div>
    </div>

    <script>
        function startMagic() {
            const name = document.getElementById('nameInput').value;
            const msgBox = document.getElementById('message');
            msgBox.innerHTML = "";
            
            if(!name) {
                msgBox.innerHTML = "لازم تكتبي الاسم الأول! 😉";
                return;
            }

            const text = `I Love You, ${name}! ❤️\nYou are the most special person in my life!\n✨ Forever & Always ✨`;
            let i = 0;
            
            function typeWriter() {
                if (i < text.length) {
                    msgBox.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, 70);
                }
            }
            typeWriter();
        }
    </script>

</body>
</html>
