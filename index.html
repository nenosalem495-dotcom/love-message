<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UL BOB - Digital Football</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            color: white;
        }

        /* الملعب أو شاشة العرض الرقمية */
        .field {
            position: relative;
            width: 800px;
            height: 350px;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            border: 3px solid #38bdf8;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        /* المرمى في الجهة اليمنى أو اليسرى */
        .goal {
            position: absolute;
            left: 20px;
            top: 100px;
            width: 40px;
            height: 150px;
            border: 3px dashed #38bdf8;
            border-left: none;
            background: rgba(56, 189, 248, 0.05);
        }

        /* اللاعب المصنوع من أرقام */
        #digital-player {
            position: absolute;
            bottom: 120px;
            left: 100px;
            font-size: 32px;
            font-weight: bold;
            color: #4ade80;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
            transition: transform 1.5s ease-in-out;
            z-index: 2;
        }

        /* الكرة المصنوعة من رقم */
        #digital-ball {
            position: absolute;
            bottom: 130px;
            left: 170px;
            font-size: 24px;
            font-weight: bold;
            color: #f43f5e;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.8);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 2;
        }

        /* زر التشغيل */
        button {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: 0.2s;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: scale(1.05);
        }

        /* ظهور اسم UL BOB بمنتصف الشاشة */
        #ul-bob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.3);
            font-size: 70px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 25px rgba(250, 204, 21, 0.9), 0 0 50px rgba(250, 204, 21, 0.5);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            letter-spacing: 4px;
        }

        /* تأثير اهتزاز الشاشة عند الشوط */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(5px, 3px); }
            100% { transform: translate(0, 0); }
        }

        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="field" id="game-field">
        <div class="goal"></div>
        <!-- اللاعب يتكون من أرقام بشكل مبدع -->
        <div id="digital-player">01[🏃]10</div>
        <!-- الكرة تتكون من رقم مميز -->
        <div id="digital-ball">0</div>
        
        <div id="ul-bob">UL BOB</div>
    </div>

    <button onclick="startDigitalAnimation()">تشغيل العرض</button>

    <script>
        function startDigitalAnimation() {
            const player = document.getElementById('digital-player');
            const ball = document.getElementById('digital-ball');
            const ulBob = document.getElementById('ul-bob');
            const field = document.getElementById('game-field');

            // إعادة تعيين الحالة الأولى
            player.style.transform = 'translateX(0px)';
            ball.style.transform = 'translate(0px, 0px)';
            ulBob.style.opacity = '0';
            ulBob.style.transform = 'translate(-50%, -50%) scale(0.3)';
            field.classList.remove('shake-effect');

            setTimeout(() => {
                // 1. اللاعب يجري ومعه الكرة ناحية اليسار نحو المرمى
                player.style.transform = 'translateX(-70px)';
                ball.style.transform = 'translateX(-70px)';

                // 2. بعد الوصول، يشوت الكرة بقوة لتصطدم بالشاشة/المرمى
                setTimeout(() => {
                    // حركة الشوط السريعة جداً للكرة ودخولها الجون
                    ball.style.transform = 'translate(-120px, -15px) scale(1.5) rotate(720deg)';
                    
                    // اهتزاز الشاشة عند الاصطدام
                    field.classList.add('shake-effect');

                    // 3. ظهور اسم UL BOB في وسط الشاشة ب1بأناقة
                    setTimeout(() => {
                        ulBob.style.opacity = '1';
                        ulBob.style.transform = 'translate(-50%, -50%) scale(1)';
                    }, 300);

                }, 1400);

            }, 100);
        }
    </script>

</body>
</html>
